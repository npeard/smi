name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # cancel previous runs of this workflow (only for the same pull request, not for main)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The project is managed by Pixi (lockfile-backed). setup-pixi installs the
    # `test` environment from pixi.lock (--locked by default) -- including the
    # `tune` feature (ray/optuna) so the search pipeline is exercised on CI.
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.9.6
      with:
        environments: test
        cache: true

    - name: Import check
      run: pixi run -e test python -c "import smi; print('Successfully imported smi package')"

    # `python -m pytest` (not bare `pytest`) so it launches via the env interpreter.
    - name: Test with pytest
      run: pixi run -e test python -m pytest
