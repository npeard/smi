# Q3 stage S3s: run-to-run spread of the noise ladder's budget (T_0 = 30, one
# seed per cell). Single-seed ladder rows differ by less than the spread the
# S0 C-curve shows at this budget, so the noise-free base (the ladder's origin)
# runs at three seeds and the nominal point at two more; the ladder is read
# against that spread.
# Run: python -m smi.experiments.runner configs/experiments/q3_s3_spread.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: tcn-44k, config: ../models/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: ladder-base, preset: noise_free, feedback_c: 0.2, alpha: 3.0}
  - {name: nominal, preset: nominal, feedback_c: 0.2, alpha: 3.0}

seeds: [0, 1, 2]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  # The family schedule (T_0 = 30) under a 100-epoch cap, not S1's T_0 = 90.
  max_epochs: 100

test_set: {seed: 1000, n_shots: 64}
