# Q3 stage S0c: the headline accuracy-vs-C curve at the adopted 90-epoch cosine
# schedule (S0b showed the 30-epoch plateau is schedule-limited), plus one
# 270-epoch run of the C = 0.2 cell as evidence of how far the fixed-budget
# "ceiling" still moves. TCN-44k, all three channels, noise-free, alpha = 3,
# with the alpha = 0 and alpha = 5 controls at C = 0.2. Michelson and C = 0.2
# at T_0 = 90 already exist from S0b (same cell keys, skipped).
# Run: python -m smi.experiments.runner configs/experiments/q3_s0c_ceiling.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: tcn-44k-T90, config: ../models/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: michelson, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - name: smi-a3
    preset: noise_free
    feedback_c: 0.2
    alpha: 3.0
    sweep: {feedback_c: [0.05, 0.1, 0.2, 0.4, 0.7, 0.9]}
  - {name: smi-a0, preset: noise_free, feedback_c: 0.2, alpha: 0.0}
  - {name: smi-a5, preset: noise_free, feedback_c: 0.2, alpha: 5.0}

seeds: [0]
oracle: false  # S1 runs the oracle at Michelson and C = 0.2; inverse_fit assumes the cosine fringe

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 150
  T_0: 90

test_set: {seed: 1000, n_shots: 64}
