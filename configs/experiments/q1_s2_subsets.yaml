# Q1 stage S2: does multi-channel beat any single channel when nothing masks
# it? The nominal-point sweep (q1_s4_snr.yaml) is phase-drift limited: every
# subset sits near the zero predictor there. Here all 7 subsets run
# noise-free, Michelson (sign-invariant) and SMI C = 0.2, alpha = 3, for the
# TCN and TCAN (the best causal family at C = 0.2 in S1). The oracle row is
# run for Michelson only (it decodes under the Michelson model).
# Run: python -m smi.experiments.runner configs/experiments/q1_s2_subsets.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: tcn-44k, config: ../models/matched/tcn-44k.yaml}
  - {name: tcan-44k, config: ../models/matched/tcan-44k.yaml}

channel_subsets:
  - [0.635]
  - [0.6748]
  - [0.515]
  - [0.635, 0.6748]
  - [0.635, 0.515]
  - [0.6748, 0.515]
  - [0.635, 0.6748, 0.515]

sims:
  - {name: s2-michelson, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - {name: s2-smi-a3, preset: noise_free, feedback_c: 0.2, alpha: 3.0}

seeds: [0]
oracle: true

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  # The family schedule (T_0 = 30) under a 100-epoch cap, not S1's T_0 = 90.
  max_epochs: 100

test_set: {seed: 1000, n_shots: 64}
