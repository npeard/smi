# Report section 1.1 demonstration of the Michelson global-sign symmetry: the
# same causal TCN-44k on noise-free three-channel data, trained (a) on Michelson
# with the plain signed loss (predicted to collapse toward zero), (b) on
# Michelson with the sign-invariant loss, and (c) on weak-feedback SMI (C = 0.2,
# alpha = 3) with the signed loss. A short fixed budget (20 epochs); the point is
# the ordering, not a ceiling.
# Run: python -m smi.experiments.runner configs/experiments/q3_exit_check.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: tcn-44k-E20, config: ../models/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: michelson-signed, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: false}
  - {name: michelson-signinv, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - {name: smi-c0.2-signed, preset: noise_free, feedback_c: 0.2, alpha: 3.0}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 20
  T_0: 20

test_set: {seed: 1000, n_shots: 64}
