# Q3 stage S0c-long: one 270-epoch run (T_0 = 270, 400-epoch cap) of the
# C = 0.2 cell of q3_s0c_ceiling.yaml (TCN-44k, all three channels,
# noise-free, alpha = 3), as evidence of how far the fixed-budget "ceiling"
# still moves past the adopted 90-epoch schedule.
# Run: python -m smi.experiments.runner configs/experiments/q3_s0c_long.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: tcn-44k-T270, config: ../models/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: smi-a3-feedback_c=0.2, preset: noise_free, feedback_c: 0.2, alpha: 3.0}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 400
  T_0: 270

test_set: {seed: 1000, n_shots: 64}
