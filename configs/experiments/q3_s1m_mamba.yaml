# Q2 stage S1m: Mamba, deferred from S1 until its scan was parallel. Same cells
# and budget as q3_s1_families.yaml; its rows join the S1 table, noted as run
# on the chunked scan and the Python 3.14 environment.
# Run: python -m smi.experiments.runner configs/experiments/q3_s1m_mamba.yaml \
#        --out report/results/synthetic_results.json
families:
  - {name: mamba-44k-T90, config: ../models/matched/mamba-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: michelson, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - name: smi-a3
    preset: noise_free
    feedback_c: 0.2
    alpha: 3.0

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 150
  T_0: 90  # S0b: the 30-epoch plateau is schedule-limited

test_set: {seed: 1000, n_shots: 64}
