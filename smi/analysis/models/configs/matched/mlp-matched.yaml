# The simple learned floor at the matched budget: 51,329 parameters, close
# under the 57,377 ceiling. Receptive field is the window exactly (256).
model:
  type: "MLP"
  window_size: 256
  in_channels: 3
  hidden_sizes: [64, 32]
  activation: "GELU"
  dropout: 0.0
  # Stride 1 makes this a point-to-point map from local input to velocity --
  # "a CNN with kernel size 1" -- which is the question the MLP row is meant to
  # answer: how much does windowed context buy over none? At the earlier stride
  # 256 the output was a staircase of 256-sample constants and the row measured
  # that discretization rather than the model.
  window_stride: 1

training:
  max_epochs: 30
  warmup_epochs: 0
  T_0: 30
  T_mult: 1
  batch_size: 16
  optimizer: "Adam"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "gpu"
  devices: [0]
  use_logging: false
  wandb_project: "smi"
  experiment_name: "mlp_matched"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.0

data:
  data_dir: "./analysis/data"
  dataset_file: "free-space-synchro_10k.h5"
  split_ratios: [80, 10, 10]
  num_workers: 7
