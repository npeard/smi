# neuraloperator-offline-19k: matched budget of 19,329 parameters (+/-10%, test_matched_configs.py).
# Offline column, unbounded context: the spectral convolution spans the whole
# input (8 retained modes), so every output sees every sample and context
# cannot be matched; only the parameter budget is (like lstm-bidir); the model
# reports receptive_field None. Same width, depth and modes as the causal
# variant, hence the same parameter count.
# Trains on full shots (train_crop_length: null), so a step carries ~4x the
# samples of the 4096-crop siblings: a training-budget confound, to be quoted
# with the "matched on budget only" caveat.
model:
  type: "NeuralOperator"
  sequence_length: 16384
  in_channels: 3  # replaced by len(synthetic.sim.wavelengths_um)
  width: 17
  n_layers: 4
  modes: 8
  kernel_len: null

training:
  max_epochs: 30
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # the runner derives it from the loss
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
  warmup_epochs: 0
  T_0: 30
  T_mult: 1
  batch_size: 16
  optimizer: "Adam"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "cpu"  # the experiment grid overrides device and precision
  precision: "32-true"
  devices: 1
  use_logging: false
  wandb_project: "smi"
  experiment_name: "neuraloperator_offline_19k"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.0
  sign_invariant: false  # the experiment runner sets it per sim

data:
  data_dir: "./analysis/data"
  dataset_file: "unused"  # not used in synthetic mode
  split_ratios: [80, 10, 10]
  num_workers: 0

synthetic:
  use_synthetic_training: true
  steps_per_epoch: 200
  # null = full shots, as the model's requires_full_length demands; the
  # experiment runner sets that itself from the model, whatever its grid says.
  train_crop_length: null
  val_steps: 20
  # Every SimConfig field, no defaults (smi.synthetic.forward.SimConfig).
  # The experiment runner replaces the whole block per cell.
  sim:
    wavelengths_um: [0.635, 0.6748, 0.515]
    sample_rate: 488281.25  # 125 MHz / decimation 256
    start_freq_hz: 1.0
    end_freq_hz: 1000.0
    drive_gain: 0.002454  # NOMINAL_DRIVE_GAIN
    feedback_c: 0.2
    alpha: 3.0
    snr_db: null
    shot_noise: false
    visibility_range: [1.0, 1.0]
    dc_offset_range: [0.0, 0.0]
    amplitude_drift_rel: 0.0
    phase_drift_rad_per_sqrt_s: 0.0
    contrast_drift_rel: 0.0
    pd_bandwidth_hz: null
    adc_bits: null
    adc_full_scale: 1.0
