# lstm-19k: matched budget of 19,329 parameters (+/-10%, test_matched_configs.py).
# Lookback is unbounded (recurrent state), so context cannot be matched; only
# the parameter budget is; the model reports receptive_field None.
# Unidirectional, so causal.
model:
  type: "LSTM"
  sequence_length: 16384
  in_channels: 3  # replaced by len(synthetic.sim.wavelengths_um)
  hidden_size: 39
  num_layers: 2
  dropout: 0.0
  bidirectional: false

training:
  max_epochs: 30
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # the runner derives it from the loss
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
    min_epochs: 30  # no stop sooner: S1 zero-output stalls lasted ~15 epochs, then escaped
  warmup_epochs: 0
  T_0: 30
  T_mult: 1
  batch_size: 16
  optimizer: "Adam"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "cpu"  # the experiment grid overrides device and precision
  precision: "32-true"
  devices: 1
  use_logging: false
  wandb_project: "smi"
  experiment_name: "lstm_19k"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.0
  sign_invariant: false  # the experiment runner sets it per sim

data:
  data_dir: "./analysis/data"
  dataset_file: "unused"  # not used in synthetic mode
  split_ratios: [80, 10, 10]
  num_workers: 0

synthetic:
  use_synthetic_training: true
  steps_per_epoch: 200
  train_crop_length: 4096  # must exceed the receptive field with margin
  val_steps: 20
  # Every SimConfig field, no defaults (smi.synthetic.forward.SimConfig).
  # The experiment runner replaces the whole block per cell.
  sim:
    acquisition:  # smi.core.acquisition.STEMLAB_125_14
      sample_rate_dec1_hz: 125000000.0
      buffer_size: 16384
      adc_bits: 14
      input_full_scale_v: 1.0
    wavelengths_um: [0.635, 0.6748, 0.515]
    sample_rate: 488281.25  # 125 MHz / decimation 256
    start_freq_hz: 1.0
    end_freq_hz: 1000.0
    drive_gain: 0.002454  # NOMINAL_DRIVE_GAIN
    feedback_c: 0.2
    alpha: 3.0
    snr_db: null
    shot_noise: false
    visibility_range: [1.0, 1.0]
    dc_offset_range: [0.0, 0.0]
    amplitude_drift_rel: 0.0
    phase_drift_rad_per_sqrt_s: 0.0
    contrast_drift_rel: 0.0
    pd_bandwidth_hz: null
    adc_bits: null
    adc_full_scale: 1.0
