# Repeated first width [32, 32, 64]: 35,585 parameters, receptive field 29 --
# the same field as tcn-varying.yaml, so the only difference is that the
# second block reuses the first block's width instead of widening.
model:
  type: "TCN"
  sequence_length: 16384
  in_channels: 3
  activation: "GELU"
  use_layer_norm: true
  use_weight_norm: false
  kernel_size: 3
  temporal_channels: [32, 32, 64]
  dilation_base: 2
  dropout: 0.0

training:
  max_epochs: 30
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # must follow loss.sign_invariant
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
    min_epochs: 30  # no stop sooner: S1 zero-output stalls lasted ~15 epochs, then escaped
  warmup_epochs: 0
  T_0: 30
  T_mult: 1
  batch_size: 16
  optimizer: "Adam"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "gpu"
  precision: "32-true"
  devices: [0]
  use_logging: false
  wandb_project: "smi"
  experiment_name: "tcn_repeated"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.0
  sign_invariant: false

data:
  data_dir: "./analysis/data"
  dataset_file: "free-space-synchro_10k.h5"
  split_ratios: [80, 10, 10]
  num_workers: 7
