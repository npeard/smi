model:
  type: "Barland" # This is the baseline model from Barland et al. 2021
  window_size: 256
  activation: "LeakyReLU"
  in_channels: 3
  dropout: 0.1
  use_weight_norm: true
  # BarlandCNN specific parameters
  window_stride: 256

training:
  max_epochs: 200
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # must follow loss.sign_invariant
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
  warmup_epochs: 0
  T_0: 200  # Initial restart period (epochs for first cosine cycle)
  T_mult: 1  # Factor to increase T_i after each restart (1 = constant period, 2 = doubling)
  batch_size: 256
  optimizer: ["Adam", "Muon"]  # Options: "Adam", "SGD", "Muon"
  weight_decay: 1e-6 # Unused if optimizer is not Adam
  momentum: 0.9 # Unused if optimizer is not SGD
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "gpu"
  precision: "32-true"
  devices: 1
  use_logging: true
  wandb_project: "smi"
  experiment_name: "barland_pareto_test"
  target: "velocity"  # "velocity" or "displacement" - what the model predicts

loss:
  dynamic: false # enable dynamic loss weighting, overrides weights below
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.0
  sign_invariant: false

data:
  data_dir: "./analysis/data"
  dataset_file: ["free-space-synchro_10k.h5", "mmfiber-synchro_10k.h5"]
  split_ratios: [[80, 10, 10]]  # train, val, test percentages
  num_workers: 7
