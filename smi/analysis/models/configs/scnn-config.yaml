model:
  type: "SCNN"
  sequence_length: 16384
  activation: "GELU"
  use_layer_norm: true
  use_weight_norm: true
  dropout: [0, 0.05]
  in_channels: 3
  # SCNN specific parameters
  kernel_size: [3, 5, 7]
  temporal_channels: [[16, 16, 32, 32, 64, 64]]
  dilation_base: [2, 3, 4]

training:
  max_epochs: 200
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # must follow loss.sign_invariant
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
  warmup_epochs: 0
  T_0: 200
  T_mult: 1
  batch_size: 128
  optimizer: "Muon"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "gpu"
  precision: "32-true"
  devices: 1
  use_logging: true
  wandb_project: "smi"
  experiment_name: "scnn_pareto_recep_scan_2"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: [0, 0.1]
  sign_invariant: false

data:
  data_dir: "./analysis/data"
  dataset_file: ["free-space-synchro_10k.h5", "mmfiber-synchro_10k.h5"]
  split_ratios: [[80, 10, 10]]
  num_workers: 7
