# Small synthetic Ray Tune search config (CPU smoke test).
#
# List-valued fields are search dimensions: smi.analysis.tune_search maps each
# to ray.tune.choice([...]) and samples one value per trial. Scalars are fixed.
# Fields whose value is itself a list (temporal_channels, wavelengths_nm,
# split_ratios) are written as a singleton list-of-lists so they round-trip as
# a single choice over inner lists.

model:
  type: "TCN"
  sequence_length: 256
  activation: "GELU"
  use_layer_norm: true
  use_weight_norm: true
  dropout: [0.0, 0.05]  # search dimension
  # in_channels is derived from synthetic.sim.wavelengths_um
  kernel_size: 3
  temporal_channels: [[8, 8, 16]]
  dilation_base: 2

training:
  max_epochs: 1
  warmup_epochs: 0
  T_0: 1
  T_mult: 1
  batch_size: 4
  optimizer: "Adam"
  weight_decay: 1e-6
  momentum: 0.9
  learning_rate: [1e-3, 5e-4]  # search dimension
  eta_min: 1e-6
  accelerator: "cpu"
  precision: "32-true"
  devices: 1
  use_logging: false
  wandb_project: "smi"
  experiment_name: "tune_smoke"
  target: "velocity"

loss:
  dynamic: false
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.1

data:
  data_dir: "./analysis/data"
  dataset_file: "unused"  # not used in synthetic mode
  split_ratios: [[80, 10, 10]]
  num_workers: 0

synthetic:
  use_synthetic_training: true
  steps_per_epoch: 2
  val_steps: 2
  # Every SimConfig field, no defaults (smi.synthetic.forward.SimConfig).
  # Michelson, noise-free: each detector knob at its exact-identity value.
  sim:
    wavelengths_um: [0.635, 0.6748, 0.515]
    sample_rate: 488281.25  # 125 MHz / decimation 256
    start_freq_hz: 1.0
    end_freq_hz: 1000.0
    drive_gain: 0.002879  # NOMINAL_DRIVE_GAIN
    feedback_c: 0.0
    alpha: 0.0
    snr_db: null
    shot_noise: false
    visibility_range: [1.0, 1.0]
    amplitude_drift_rel: 0.0
    phase_drift_rad_per_sqrt_s: 0.0
    contrast_drift_rel: 0.0
    pd_bandwidth_hz: null
    adc_bits: null
    adc_full_scale: 1.0
