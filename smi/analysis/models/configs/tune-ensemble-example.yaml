# Small synthetic ensemble search config (CPU smoke test).
#
# The architecture is FIXED here (model/training scalars); the `ensemble` section
# carries the within-architecture axis. A Ray Tune trial trains a vmap-ensemble
# (smi.analysis.ensemble.SyntheticEnsembleModule) of K = len(per_member_lr)
# members on one shared on-GPU synthetic batch, and reports the best member's
# val/total_unweighted_loss. The `ensemble` section passes through verbatim --
# its lists are per-member specs, not tune.choice search dimensions. Values that
# are themselves lists (temporal_channels, wavelengths_nm) are singleton
# list-of-lists so they round-trip through the search-space builder.

model:
  type: "TCN"
  sequence_length: 256
  activation: "GELU"
  use_layer_norm: true
  use_weight_norm: true
  dropout: 0.0
  kernel_size: 3
  temporal_channels: [[8, 8, 16]]
  dilation_base: 2

training:
  max_epochs: 1
  check_val_every_n_epoch: 1  # validate every epoch; patience_epochs counts these
  convergence:  # stop on a plateau; max_epochs above stays the cap
    monitor: "val/velocity_rmse_um_per_ms"  # must follow loss.sign_invariant
    patience_epochs: 10
    min_rel_delta: 0.01  # improvement below 1% of the best counts as none
    min_epochs: 30  # no stop sooner: S1 zero-output stalls lasted ~15 epochs, then escaped
  batch_size: 4
  learning_rate: 1e-3
  accelerator: "cpu"
  precision: "32-true"
  devices: 1
  target: "velocity"

loss:
  velocity_loss_weight: 1.0
  displacement_loss_weight: 0.1
  sign_invariant: false

synthetic:
  use_synthetic_training: true
  steps_per_epoch: 2
  train_crop_length: null  # null trains on the full 16384-sample shot
  val_steps: 2
  # Every SimConfig field, no defaults (smi.synthetic.forward.SimConfig).
  # Michelson, noise-free: each detector knob at its exact-identity value.
  sim:
    wavelengths_um: [0.635, 0.6748, 0.515]
    sample_rate: 488281.25  # 125 MHz / decimation 256
    start_freq_hz: 1.0
    end_freq_hz: 1000.0
    drive_gain: 0.002454  # NOMINAL_DRIVE_GAIN
    feedback_c: 0.0
    alpha: 0.0
    snr_db: null
    shot_noise: false
    visibility_range: [1.0, 1.0]
    dc_offset_range: [0.0, 0.0]
    amplitude_drift_rel: 0.0
    phase_drift_rad_per_sqrt_s: 0.0
    contrast_drift_rel: 0.0
    pd_bandwidth_hz: null
    adc_bits: null
    adc_full_scale: 1.0

ensemble:
  size: 3
  # Per-member learning rates (length defines K); enables manual per-member-lr
  # optimization in EnsembleModule. Use decimal notation -- YAML parses bare
  # scientific notation like 1e-3 as a string.
  per_member_lr: [0.001, 0.0005, 0.0001]
