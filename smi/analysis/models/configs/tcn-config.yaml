model:
  type: "TCN"
  sequence_length: 16384
  activation: "GELU"
  use_layer_norm: true
  use_weight_norm: true
  dropout: [0, 0.05]
  in_channels: 3
  # TCN specific parameters
  kernel_size: [3, 5, 7]
  temporal_channels: [[16, 16, 32, 32, 64, 64]]
  dilation_base: [2, 3, 4]

training:
  max_epochs: 200
  warmup_epochs: 0
  T_0: 200  # Initial restart period (epochs for first cosine cycle)
  T_mult: 1  # Factor to increase T_i after each restart (1 = constant period, 2 = doubling)
  batch_size: 128
  optimizer: "Muon"  # Options: "Adam", "SGD", "Muon"
  weight_decay: 1e-6 # Unused if optimizer is not Adam
  momentum: 0.9 # Unused if optimizer is not SGD
  learning_rate: 1e-3
  eta_min: 1e-6
  accelerator: "gpu"
  devices: 1
  use_logging: true
  wandb_project: "smi"
  experiment_name: "tcn_pareto_recep_scan_2"
  target: "velocity"  # "velocity" or "displacement" - what the model predicts

loss:
  dynamic: false # enable dynamic loss weighting, overrides weights below, usually not better than fixed weights
  velocity_loss_weight: 1.0
  displacement_loss_weight: [0, 0.1]

data:
  data_dir: "./analysis/data"
  dataset_file: ["free-space-synchro_10k.h5", "mmfiber-synchro_10k.h5"]
  split_ratios: [[80, 10, 10]]  # train, val, test percentages
  num_workers: 7
