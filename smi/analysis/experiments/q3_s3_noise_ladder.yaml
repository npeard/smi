# Q3 stage S3: the noise ladder. TCN-44k, all three channels, SMI C = 0.2,
# alpha = 3. Each detector/drift knob is swept ALONE from the noise-free base
# over its NOMINAL_SWEEPS range (smi/synthetic/forward.py), then every knob at
# its nominal value together (the nominal operating point). Which single knob
# moves RMSE most, at its nominal value, is the case for or against new
# electronics. shot_noise is omitted alone: it needs an SNR and so is only
# meaningful inside the nominal point. drive_gain is motion scale, not noise.
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q3_s3_noise_ladder.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: tcn-44k, config: ../models/configs/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: ladder-snr, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {snr_db: [10.0, 20.0, 30.0, 40.0, 50.0]}}
  - {name: ladder-visibility, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {visibility_range: [[0.1, 1.0], [0.3, 1.0], [0.5, 1.0], [0.7, 1.0], [0.9, 1.0]]}}
  - {name: ladder-dc, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {dc_offset_range: [[-0.1, 0.1], [-0.3, 0.3], [-1.0, 1.0]]}}
  - {name: ladder-ampdrift, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {amplitude_drift_rel: [0.02, 0.05, 0.1, 0.2, 0.5]}}
  - {name: ladder-phasedrift, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {phase_drift_rad_per_sqrt_s: [10.74743605277774, 21.49487210555548, 35.31967896870391, 58.0361546849998, 116.0723093699996]}}
  - {name: ladder-contrastdrift, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {contrast_drift_rel: [0.02, 0.05, 0.1, 0.2, 0.5]}}
  - {name: ladder-pdbw, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {pd_bandwidth_hz: [200000.0, 100000.0, 30000.0, 10000.0, 3000.0]}}
  - {name: ladder-adc, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     override: {adc_full_scale: 2.0},
     sweep: {adc_bits: [14, 12, 10, 8]}}
  - {name: nominal, preset: nominal, feedback_c: 0.2, alpha: 3.0}
  # best C of the noise-free curve (monotone in C up to 0.9, q3_s0c_ceiling)
  - {name: nominal-c0.9, preset: nominal, feedback_c: 0.9, alpha: 3.0}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 100  # SCHEDULE: set from S0b

test_set: {seed: 1000, n_shots: 64}
