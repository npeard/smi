# Q3 stage S3m: matched training length for the leave-one-out's headline row.
# Removing phase drift cut the nominal error ~44% (q3_s3_leave_one_out.yaml),
# but that cell trained ~64 epochs against ~35 for the nominal point, and the
# noise-free base itself gains 36-49% from longer training. Here the nominal
# point, the nominal point without phase drift, and the noise-free base all
# train exactly 60 epochs, so the comparison is at equal length; so does the
# ladder's phase-drift sweep.
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q3_s3_matched_length.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: tcn-44k-E60, config: ../models/configs/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: nominal, preset: nominal, feedback_c: 0.2, alpha: 3.0}
  - {name: nominal-no-phasedrift, preset: nominal, feedback_c: 0.2, alpha: 3.0,
     override: {phase_drift_rad_per_sqrt_s: 0.0}}
  - {name: ladder-base, preset: noise_free, feedback_c: 0.2, alpha: 3.0}
  # The ladder's phase-drift rows trained 36-67 epochs; at equal length the
  # curve says what a partial drift cut buys.
  - {name: ladder-phasedrift, preset: noise_free, feedback_c: 0.2, alpha: 3.0,
     sweep: {phase_drift_rad_per_sqrt_s: [10.74743605277774, 21.49487210555548, 35.31967896870391, 58.0361546849998, 116.0723093699996]}}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  # Exactly 60 epochs, the bottom of the second 30-epoch cosine cycle: patience
  # longer than the cap disables plateau stopping, so every cell trains the
  # same length and length cannot explain a difference.
  max_epochs: 60
  convergence:
    monitor: "val/velocity_rmse_um_per_ms"  # the runner derives it from the loss
    patience_epochs: 1000
    min_rel_delta: 0.01
    min_epochs: 30

test_set: {seed: 1000, n_shots: 64}
