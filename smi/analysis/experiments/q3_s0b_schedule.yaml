# Q3 stage S0b: is the noise-free "ceiling" schedule-limited? The S0 pilot's
# runs all stopped near epoch 38 -- the bottom of the 30-epoch cosine cycle
# plus patience 10 -- so the plateau may be the schedule's, not the model's.
# Same TCN-44k cells with a 3x longer cosine period; if RMSE moves by more
# than ~10%, every later stage uses the longer schedule.
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q3_s0b_schedule.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: tcn-44k-T90, config: ../models/configs/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: michelson, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - {name: smi-a3-feedback_c=0.2, preset: noise_free, feedback_c: 0.2, alpha: 3.0}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 150
  T_0: 90

test_set: {seed: 1000, n_shots: 64}
