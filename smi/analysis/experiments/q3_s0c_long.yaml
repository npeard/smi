# Q3 stage S0c-long (one cell, 270-epoch schedule; see q3_s0c_ceiling.yaml): the headline accuracy-vs-C curve at the adopted 90-epoch cosine
# schedule (S0b showed the 30-epoch plateau is schedule-limited), plus one
# 270-epoch run of the C = 0.2 cell as evidence of how far the fixed-budget
# "ceiling" still moves. TCN-44k, all three channels, noise-free, alpha = 3,
# with the alpha = 0 and alpha = 5 controls at C = 0.2. Michelson and C = 0.2
# at T_0 = 90 already exist from S0b (same cell keys, skipped).
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q3_s0c_ceiling.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: tcn-44k-T270, config: ../models/configs/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635, 0.6748, 0.515]

sims:
  - {name: smi-a3-feedback_c=0.2, preset: noise_free, feedback_c: 0.2, alpha: 3.0}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  max_epochs: 400
  T_0: 270

test_set: {seed: 1000, n_shots: 64}
