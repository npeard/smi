# Q1 stage S4: does multi-channel beat any single channel, and where? TCN-44k on
# all 7 subsets of the rig wavelengths, at the nominal operating point (SMI
# C = 0.2, alpha = 3, every knob nominal) with the SNR swept. The classical
# oracle runs separately (q1_s4_oracle.yaml) on the 3-channel and best
# single-channel subsets only, because inverse_fit costs ~8.5 min per set.
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q1_s4_snr.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: tcn-44k, config: ../models/configs/matched/tcn-44k.yaml}

channel_subsets:
  - [0.635]
  - [0.6748]
  - [0.515]
  - [0.635, 0.6748]
  - [0.635, 0.515]
  - [0.6748, 0.515]
  - [0.635, 0.6748, 0.515]

sims:
  - {name: q1-nominal, preset: nominal, feedback_c: 0.2, alpha: 3.0,
     sweep: {snr_db: [0.0, 10.0, 20.0, 30.0, 40.0]}}

seeds: [0]
oracle: false

loss:
  sign_invariant: false

synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true
  # The family schedule (T_0 = 30) under a 100-epoch cap, not S1's T_0 = 90.
  max_epochs: 100

test_set: {seed: 1000, n_shots: 64}
