# Q3/Q2 stage S1d: the families that stalled at the zero-output plateau under
# the velocity target (LSTM, LSTM-bidir on both sims; offline neural operator
# at C = 0.2), retrained on displacement, plus a TCN control that tells
# whether retargeting costs a family that already trains. Same sims, channels,
# budget and frozen test sets as q3_s1_families.yaml, so each cell pairs with
# its S1 velocity-target cell on identical shots. Decision metrics are fixed
# in the round-2 rerun plan, section (b).
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q3_s1d_displacement.yaml \
#        --out smi/analysis/data/synthetic_results.json
families:
  - {name: lstm-44k-disp-T90, config: ../models/configs/displacement/lstm-44k.yaml}
  - {name: lstm-bidir-44k-disp-T90, config: ../models/configs/displacement/lstm-bidir-44k.yaml}
  - {name: neuraloperator-offline-44k-disp-T90, config: ../models/configs/displacement/neuraloperator-offline-44k.yaml}
  - {name: tcn-44k-disp-T90, config: ../models/configs/displacement/tcn-44k.yaml}
channel_subsets:
  - [0.635, 0.6748, 0.515]
sims:
  - {name: michelson, preset: noise_free, feedback_c: 0.0, alpha: 0.0, sign_invariant: true}
  - {name: smi-a3, preset: noise_free, feedback_c: 0.2, alpha: 3.0}
seeds: [0]
oracle: false
loss: {sign_invariant: false}
synthetic: {steps_per_epoch: 200, val_steps: 20, train_crop_length: 4096}
training: {accelerator: mps, devices: 1, precision: 32-true, max_epochs: 150, T_0: 90}
test_set: {seed: 1000, n_shots: 64}
