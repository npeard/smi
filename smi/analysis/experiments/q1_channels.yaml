# Q1: which photodiode channels carry the information. Every non-empty subset
# of the three rig lasers, at the nominal weak-feedback SMI point, noise-free
# (ceiling) and with the nominal noise model.
# Run: python -m smi.analysis.experiments smi/analysis/experiments/q1_channels.yaml
# Every existing family at the 44k budget (Task 19); later families extend this.
families:
  - {name: tcn-44k, config: ../models/configs/matched/tcn-44k.yaml}
  - {name: scnn-44k, config: ../models/configs/matched/scnn-44k.yaml}
  - {name: barland-44k, config: ../models/configs/matched/barland-44k.yaml}
  - {name: tcan-44k, config: ../models/configs/matched/tcan-44k.yaml}
  - {name: lstm-44k, config: ../models/configs/matched/lstm-44k.yaml}
  - {name: lstm-bidir-44k, config: ../models/configs/matched/lstm-bidir-44k.yaml}
  - {name: mamba-44k, config: ../models/configs/matched/mamba-44k.yaml}
  - {name: mlp-44k, config: ../models/configs/matched/mlp-44k.yaml}
  - {name: patchtransformer-causal-44k, config: ../models/configs/matched/patchtransformer-causal-44k.yaml}
  - {name: patchtransformer-offline-44k, config: ../models/configs/matched/patchtransformer-offline-44k.yaml}
  - {name: unettransformer-causal-44k, config: ../models/configs/matched/unettransformer-causal-44k.yaml}
  - {name: unettransformer-offline-44k, config: ../models/configs/matched/unettransformer-offline-44k.yaml}
  - {name: neuraloperator-causal-44k, config: ../models/configs/matched/neuraloperator-causal-44k.yaml}
  - {name: neuraloperator-offline-44k, config: ../models/configs/matched/neuraloperator-offline-44k.yaml}

channel_subsets:
  - [0.635]
  - [0.6748]
  - [0.515]
  - [0.635, 0.6748]
  - [0.635, 0.515]
  - [0.6748, 0.515]
  - [0.635, 0.6748, 0.515]

sims:
  - {name: noise-free, preset: noise_free, feedback_c: 0.2, alpha: 3.0}
  - {name: nominal, preset: nominal, feedback_c: 0.2, alpha: 3.0}

seeds: [0, 1, 2]
oracle: true

loss:
  sign_invariant: false

# Each family's own schedule (30 epochs, T_0 = 30), not S1's T_0 = 90.
synthetic:
  steps_per_epoch: 200
  val_steps: 20
  train_crop_length: 4096

training:
  accelerator: mps
  devices: 1
  precision: 32-true

test_set: {seed: 1000, n_shots: 64}
