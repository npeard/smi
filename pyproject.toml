[project]
name = "smi"
version = "0.1.0"
description = "Self-Mixing Interferometry for Rapid Vibration/Acoustic Spectrograms"
authors = [
    {name = "Nolan Peard", email = "nolan.peard@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib",
    "numba",
    "torch>=2.5",
    "lightning",
    "h5py",
    "tqdm",
    "pyyaml",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/npeard/smi"
"Bug Tracker" = "https://github.com/npeard/smi/issues"

[build-system]
requires = ["flit_core>=3.9.0,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose"
filterwarnings = [
    # Ignore external package warnings
    "ignore::UserWarning:torch.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:torch.*",
    "ignore::UserWarning:numpy.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::UserWarning:scipy.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::UserWarning:matplotlib.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::UserWarning:lightning.*",
    "ignore::DeprecationWarning:lightning.*",
    "ignore::FutureWarning:lightning.*",
    "ignore::UserWarning:numba.*",
    "ignore::DeprecationWarning:numba.*",
    # Keep warnings from your own package (as warnings, not errors)
    "default::Warning:smi.*",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=3.0",
    "pytest-xdist>=2.5",
    "pytest-benchmark",
]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "codespell",
    "pre-commit",
    "nbstripout",
    "ty",             # Type checking
    "bandit",         # Security linting
    "coverage[toml]", # Coverage with pyproject.toml support
    "marimo",
    "lmfit",
    "uncertainties",
    "schemdraw",
]

[tool.flit.module]
name = "smi"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "D", "UP", "YTT", "ANN", "BLE", "B", "A", "C4", "FA",
    "INP", "NPY201", "PIE", "T20", "PYI", "PT", "RSE", "RET", "SLF", "SIM", "INT",
    "ARG", "PTH", "PL", "TRY", "FLY", "NPY", "RUF", "S", "N", "PERF", "FURB",
]
extend-select = ["D204", "D400", "D404", "D406", "D410"]
ignore = [
    # Import-related (keep for __init__.py files)
    "F403", "F405",
    # Style preferences
    "E741",  # Ambiguous variable names (sometimes necessary in scientific code)
    # Documentation (reasonable for scientific/research code)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205", "D405", "D417",
    # Type annotations (reasonable choices)
    "ANN002", "ANN003", "ANN401",
    # Argument usage (common in scientific APIs)
    "ARG001",
    # Return style preference
    "RET505",
    # Exception handling (reasonable for research code)
    "TRY003",
    # Complexity (reasonable limits for scientific code)
    "PLR0913", "PLR2004",
    # Private access (sometimes needed for scientific libraries)
    "SLF001",
    # Security (may need adjustment based on your needs)
    "S101",  # Use of assert (common in scientific code)
    "S311",  # Random generators (often fine for scientific use)
    # Naming (scientific computing often uses uppercase for matrices/operators)
    "N803", # Argument names should be lowercase (conflicts with math notation for matrices)
    "N806", "N802", # Variable names should be lowercase (conflicts with math notation)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs/**.py" = ["INP001", "ARG001", "ANN"]
"conftest.py" = ["ANN"]
"tests/**.py" = ["ANN", "INP001"]
# Runs each figure script in a subprocess, which is the point: the tests check
# the CLI contract the Snakefile invokes, not an importable function. The
# argv is sys.executable plus paths globbed from the repo, so there is no
# untrusted input. Scoped to this file rather than widened to tests/**.
"tests/test_report_build.py" = ["S603"]
# Marimo notebooks define imports inside reactive cells (PLC0415 is expected).
"notebooks/**.py" = ["T201", "ANN", "INP001", "E501", "B018", "PLR0915", "PTH123", "F841", "PLC0415"]
"*.ipynb" = ["ALL"]
"scripts/check_ascii.py" = ["S603", "S607", "T201"]
# preflight.py and platform_paths.py are copied verbatim from
# ~/Documents/Projects/claude-config, which is where they are maintained and
# linted. Reformatting them to this project's stricter rules would fork them
# from upstream and make the next copy a merge, so the local rules they trip
# are disabled rather than the files edited.
"scripts/preflight.py" = ["ANN202", "B007", "D301", "PLC0415", "PTH115", "S603", "S607", "T201"]
"scripts/platform_paths.py" = ["ANN202", "D301", "INP001", "PLC0415", "PTH115", "S603", "S607", "T201"]
# report/figures/*.py are standalone scripts run by the Snakefile, not an
# importable package, so they have no __init__.py (INP001) and import their
# shared helpers via a sys.path insert rather than a package-relative import
# (E402 -- the insert must precede the import it enables).
"report/figures/*.py" = ["INP001", "E402"]
# Same shape as scripts/check_ascii.py above: a build gate whose entire
# interface is an exit code plus a message on stdout/stderr, invoked by the
# Snakefile rather than imported. Printing is the output contract (T201) and
# it is not a package (INP001).
"report/scripts/*.py" = ["INP001", "T201"]
# Prints its results table to stdout; that table is the deliverable. Listed
# here rather than as eleven inline noqa comments, to match how every other
# print-interface script in this project is handled.
"smi/analysis/benchmark_loading.py" = ["T201"]
"tests/plot_waveforms.py" = ["PLR0915", "E501"]
"smi/redpitaya/manager.py" = ["C901", "PLR0912", "PLR0915"]
"smi/redpitaya/scpi.py" = ["C901", "PLR0912", "PLR0915", "E501"]
"smi/analysis/inspect_data.py" = ["PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,*.ipynb"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
polars = ">=1.0"
# numpy and numba deliberately come from PyPI (via [project.dependencies]),
# NOT conda. Conda-forge numpy links libomp.dll while the PyPI CUDA torch
# wheel bundles Intel's libiomp5md.dll; loading both in one process makes
# OpenMP abort ("OMP: Error #15"), which killed np.corrcoef mid-test-suite.
# The documented KMP_DUPLICATE_LIB_OK escape hatch is explicitly unsafe and
# can silently corrupt results, so instead keep a single OpenMP runtime by
# sourcing the whole numeric stack from one place.
# ruff/codespell live in the default env so the `format`/`lint`/`spell` tasks
# (defined under [tool.pixi.tasks], which runs in the default env) use the
# pinned, lockfile-backed tools instead of whatever happens to be on PATH.
ruff = ">=0.15,<0.16"
codespell = "*"

[tool.pixi.pypi-dependencies]
smi = { path = ".", editable = true }

# Torch arrives via the editable `smi` install, and PyPI's default win-64 torch
# wheel is CPU-only -- which cannot answer the GPU-residency question this
# project needs measured. Pin the CUDA 12.4 index explicitly on both supported
# platforms so `torch.cuda.is_available()` is true out of the box.
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cu124" }

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = "*"
nbstripout = "*"
ty = "*"
bandit = "*"
marimo = "*"
lmfit = "*"
uncertainties = "*"
schemdraw = "*"

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=3.0"
pytest-xdist = ">=2.5"
pytest-benchmark = "*"
coverage = { version = "*", extras = ["toml"] }

# Hyperparameter / architecture search (smi/analysis/tune_search.py). Included
# in every test-running env so the search pathway is exercised on CPU in CI as
# well as on the GPU rig. See docs/hyperparameter-search-pipeline-design.md.
[tool.pixi.feature.tune.pypi-dependencies]
ray = { version = ">=2.9", extras = ["tune"] }
optuna = "*"

[tool.pixi.environments]
# The default env includes the test feature so the `test`/`all` tasks (defined
# under [tool.pixi.tasks], which run in the default env) have pytest available.
# `tune` is everywhere so the Ray search path is import- and test-able in CI.
default = { features = ["test", "tune"], solve-group = "default" }
dev = { features = ["dev", "test", "tune"], solve-group = "default" }
test = { features = ["test", "tune"], solve-group = "default" }
report = { features = ["report"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check ."
ascii = "python scripts/check_ascii.py"
# `python -m pytest` (not bare `pytest`) so it runs via the env's interpreter.
test = "python -m pytest"
spell = "python -m codespell_lib ."
precommit = "pre-commit run --all-files"

[tool.pixi.feature.dev.tasks]
typecheck = "ty check"
all = { depends-on = ["format", "lint", "ascii", "typecheck", "test"] }
# Data-loading throughput measurement (smi/analysis/benchmark_loading.py).
# Deliberately not part of `all`: it needs a CUDA GPU and takes minutes, and
# its answer only changes when the model or the loader path changes.
benchmark-loading = "python -m smi.analysis.benchmark_loading"

[tool.ty.environment]
python-version = "3.12"
# Resolve third-party imports against the dev pixi environment explicitly, so
# `ty` is deterministic whether invoked via `pixi run typecheck` (env activated)
# or directly by the pre-commit hook (`.pixi/envs/dev/bin/ty`, env not active).
python = ".pixi/envs/dev"

[tool.ty.src]
# notebooks/ are exploratory marimo apps (like .ipynb, already excluded) with
# optional-only deps (e.g. torchview); they are not type-gated library code.
exclude = [".pixi", "**/*.ipynb", "notebooks/**"]

# Rules dominated by PyTorch / scientific-library typing gaps (incomplete third-
# party stubs, autograd Function patterns). Downgraded so the high-signal rules
# stay actionable; promote back to "error" individually as stubs improve.
[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
possibly-missing-submodule = "ignore"

[tool.coverage.run]
source = ["smi"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

# Typst report/slides build (report/). The whole document toolchain is
# lockfile-reproducible with no manual install step -- unlike a LaTeX engine,
# where no conda package ships a usable macro tree.
[tool.pixi.feature.report.dependencies]
# typst only: it is a self-contained Rust binary with no OpenMP/BLAS linkage,
# so it cannot collide with the PyPI numeric stack. matplotlib and h5py come
# from PyPI with everything else -- see the OpenMP note above.
typst = "*"

# Snakemake has no conda-forge win-64 build at all (it is packaged only for
# linux-64/osx), so it comes from PyPI, where the wheels are pure Python and
# run fine here. Verified on win-64: a figure -> typst -> PDF DAG executes and
# re-runs incrementally. Only *local* (--cores) execution is exercised; the
# cluster and --use-conda executors are the parts with real Windows gaps.
[tool.pixi.feature.report.pypi-dependencies]
snakemake = ">=8"
matplotlib = "*"
h5py = "*"

# Report build tasks. These live under the `report` feature, not
# [tool.pixi.tasks], because the latter runs in the default env, which has
# neither typst nor snakemake. `cwd` points them at report/ so the Snakefile's
# relative paths resolve the same whether you invoke a task from the repo root
# or run snakemake by hand from inside report/.
[tool.pixi.feature.report.tasks]
report = { cmd = "snakemake --cores all", cwd = "report" }
report-dry = { cmd = "snakemake --cores all -n", cwd = "report" }
report-clean = { cmd = "snakemake --cores 1 clean", cwd = "report" }
report-slides = { cmd = "snakemake --cores all build/slides.pdf", cwd = "report" }
report-baseline = { cmd = "snakemake --cores all build/baseline.pdf", cwd = "report" }
