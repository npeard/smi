[project]
name = "smi"
version = "0.1.0"
description = "Self-Mixing Interferometry for Rapid Vibration/Acoustic Spectrograms"
authors = [
    {name = "Nolan Peard", email = "nolan.peard@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.5",
    "matplotlib",
    "numba>=0.68",
    "torch>=2.14",
    "lightning>=2.6",
    "h5py>=3.16",
    "tqdm",
    "pyyaml",
    "scipy>=1.18",
]

[project.urls]
"Homepage" = "https://github.com/npeard/smi"
"Bug Tracker" = "https://github.com/npeard/smi/issues"

[build-system]
requires = ["flit_core>=3.9.0,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/redpitaya/tests"]
# The figure scripts import _figcommon as a sibling module.
pythonpath = ["report/figures"]
python_files = "test_*.py"
addopts = "--verbose"
filterwarnings = [
    # Ignore external package warnings
    "ignore::UserWarning:torch.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:torch.*",
    "ignore::UserWarning:numpy.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::UserWarning:scipy.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::UserWarning:matplotlib.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::UserWarning:lightning.*",
    "ignore::DeprecationWarning:lightning.*",
    "ignore::FutureWarning:lightning.*",
    "ignore::UserWarning:numba.*",
    "ignore::DeprecationWarning:numba.*",
    # Keep warnings from your own package (as warnings, not errors)
    "default::Warning:smi.*",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=3.0",
    "pytest-xdist>=2.5",
    "pytest-benchmark",
]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "codespell",
    "pre-commit",
    "nbstripout",
    "ty",             # Type checking
    "bandit",         # Security linting
    "coverage[toml]", # Coverage with pyproject.toml support
    "marimo",
    "lmfit",
    "uncertainties",
    "schemdraw",
]

[tool.flit.module]
name = "smi"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "D", "UP", "YTT", "ANN", "BLE", "B", "A", "C4", "FA",
    "INP", "NPY201", "PIE", "T20", "PYI", "PT", "RSE", "RET", "SLF", "SIM", "INT",
    "ARG", "PTH", "PL", "TRY", "FLY", "NPY", "RUF", "S", "N", "PERF", "FURB",
]
extend-select = ["D204", "D400", "D404", "D406", "D410"]
ignore = [
    # Import-related (keep for __init__.py files)
    "F403", "F405",
    # Style preferences
    "E741",  # Ambiguous variable names (sometimes necessary in scientific code)
    # Documentation (reasonable for scientific/research code)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205", "D405", "D417",
    # Type annotations (reasonable choices)
    "ANN002", "ANN003", "ANN401",
    # Argument usage (common in scientific APIs)
    "ARG001",
    # Return style preference
    "RET505",
    # Exception handling (reasonable for research code)
    "TRY003",
    # Complexity (reasonable limits for scientific code)
    # PLR0917 (new in ruff 0.17) is the positional twin of PLR0913: same call
    # shape, same reason; keyword-only rewrites would touch every call site.
    "PLR0913", "PLR0917", "PLR2004",
    # Private access (sometimes needed for scientific libraries)
    "SLF001",
    # Security (may need adjustment based on your needs)
    "S101",  # Use of assert (common in scientific code)
    "S311",  # Random generators (often fine for scientific use)
    # Naming (scientific computing often uses uppercase for matrices/operators)
    "N803", # Argument names should be lowercase (conflicts with math notation for matrices)
    "N806", "N802", # Variable names should be lowercase (conflicts with math notation)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs/**.py" = ["INP001", "ARG001", "ANN"]
"conftest.py" = ["ANN"]
"tests/**.py" = ["ANN", "INP001"]
"packages/redpitaya/tests/**.py" = ["ANN", "INP001"]
# Runs each figure script in a subprocess, which is the point: the tests check
# the CLI contract the Snakefile invokes, not an importable function. The
# argv is sys.executable plus paths globbed from the repo, so there is no
# untrusted input. Scoped to this file rather than widened to tests/**.
"tests/test_report_build.py" = ["S603"]
# Same shape: the subprocess argv is sys.executable plus a literal probe.
"tests/test_platform.py" = ["S603"]
# Same shape: argv is sys.executable plus this repo's runner module and tmp paths.
"tests/test_experiments.py" = ["S603"]
# Marimo notebooks define imports inside reactive cells (PLC0415 is expected).
"notebooks/**.py" = ["T201", "ANN", "INP001", "E501", "B018", "PLR0915", "PTH123", "F841", "PLC0415"]
"*.ipynb" = ["ALL"]
# Print-interface scripts. These are run, not imported: what they write to
# stdout (and their exit code) is the deliverable, so T201 does not apply,
# and they are not packages, so INP001 does not either. Grouped under one
# rationale rather than repeated per file -- a new script of this shape
# belongs in this block, not in a fresh entry with its own justification.
"report/scripts/*.py" = ["INP001", "T201"]
"scripts/*.py" = ["INP001"]
"scripts/benchmark_loading.py" = ["T201"]
# report/figures/*.py are the same shape, and additionally import their shared
# helpers through a sys.path insert, which must precede the import it enables
# (E402).
"report/figures/*.py" = ["INP001", "E402"]
"tests/plot_waveforms.py" = ["PLR0915", "E501"]
"packages/redpitaya/src/stemlab/scpi.py" = ["C901", "PLR0912", "PLR0915", "E501"]
"scripts/inspect_data.py" = ["PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,*.ipynb"

[tool.pixi.workspace]
channels = ["conda-forge"]
# The Apple-silicon entry (osx-arm64) declares macOS 14: torch>=2.14 wheels are tagged
# macosx_14_0, and pixi assumes 13.0 by default and finds no matching wheel.
platforms = [
    "win-64",
    "linux-64",
    { name = "macos-14-arm64", platform = "osx-arm64", macos = "14.0" },
]

[tool.pixi.dependencies]
python = ">=3.14,<3.15"
polars = ">=2.1"
# numpy and numba deliberately come from PyPI (via [project.dependencies]),
# NOT conda. Conda-forge numpy links libomp.dll while the PyPI CUDA torch
# wheel bundles Intel's libiomp5md.dll; loading both in one process makes
# OpenMP abort ("OMP: Error #15"), which killed np.corrcoef mid-test-suite.
# The documented KMP_DUPLICATE_LIB_OK escape hatch is explicitly unsafe and
# can silently corrupt results, so instead keep a single OpenMP runtime by
# sourcing the whole numeric stack from one place.
# ruff/codespell live in the default env so the `format`/`lint`/`spell` tasks
# (defined under [tool.pixi.tasks], which runs in the default env) use the
# pinned, lockfile-backed tools instead of whatever happens to be on PATH.
ruff = ">=0.17,<0.18"
codespell = "*"

# The PyPI lightgbm macOS wheel does not bundle libomp and looks for
# @rpath/libomp.dylib (Homebrew's copy, absent here). A second runtime next to
# torch's deadlocks threaded lightgbm fits, so the activation script links
# torch's own libomp into the env instead of installing conda's llvm-openmp.
# tests/test_platform.py runs torch, lightgbm and scikit-learn threads together.
[tool.pixi.target.macos-14-arm64.activation]
scripts = ["scripts/link-torch-libomp.sh"]

[tool.pixi.pypi-dependencies]
smi = { path = ".", editable = true }
# The Red Pitaya library: its own distribution so it can move to its own repo
# with a git mv plus this line.
stemlab = { path = "packages/redpitaya", editable = true }
# The generic gates (check-ascii, preflight), pinned to the same tag as the
# pre-commit hook. Bump both together.
agent-config = { git = "https://github.com/npeard/agent-config", tag = "v0.1.1" }

# Torch arrives via the editable `smi` install, and PyPI's default win-64 torch
# wheel is CPU-only -- which cannot answer the GPU-residency question this
# project needs measured. Pin the CUDA 13.0 index explicitly on the two CUDA
# platforms so `torch.cuda.is_available()` is true out of the box.
#
# cu130 and not an older channel because the cu124 index stops publishing at
# torch 2.6.0 for cp312/win-64; 2.14 exists only from cu130 onward. CUDA 13
# drops Maxwell/Pascal/Volta but keeps sm_75, so both GPUs on this box (RTX
# 3090 Ti sm_86, Quadro RTX 4000 sm_75) remain supported.
[tool.pixi.target.win-64.pypi-dependencies]
torch = { version = ">=2.14", index = "https://download.pytorch.org/whl/cu130" }

[tool.pixi.target.linux-64.pypi-dependencies]
torch = { version = ">=2.14", index = "https://download.pytorch.org/whl/cu130" }

# osx-arm64 is for MPS work on the Apple machine. The default PyPI wheel
# ships MPS, so no index override; the CUDA index has no macOS wheels.
[tool.pixi.target.macos-14-arm64.pypi-dependencies]
torch = ">=2.15"

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = "*"
nbstripout = "*"
ty = "*"
bandit = "*"
marimo = "*"
lmfit = "*"
uncertainties = "*"
schemdraw = "*"
import-linter = "*"

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=3.0"
pytest-xdist = ">=2.5"
pytest-benchmark = "*"
import-linter = "*"
coverage = { version = "*", extras = ["toml"] }

# Non-torch reference models (smi/estimators/tabular.py). Included in every
# test-running env, so CI exercises the baselines the TCN is
# measured against.
#
# Both link an OpenMP runtime, which is the documented hazard here (see the
# note on [tool.pixi.dependencies]). They come from PyPI along with the rest
# of the numeric stack precisely so there is still only one such runtime in
# the process; verified by importing them alongside torch and running
# np.corrcoef, the site where a second runtime previously aborted the suite.
[tool.pixi.feature.simple.pypi-dependencies]
lightgbm = ">=4.7"
scikit-learn = ">=1.9"

[tool.pixi.environments]
# The default env includes the test feature so the `test`/`all` tasks (defined
# under [tool.pixi.tasks], which run in the default env) have pytest available.
# `simple` is everywhere so the non-torch baselines are import- and test-able
# in CI.
default = { features = ["test", "simple"], solve-group = "default" }
dev = { features = ["dev", "test", "simple"], solve-group = "default" }
test = { features = ["test", "simple"], solve-group = "default" }
report = { features = ["report"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check ."
ascii = "check-ascii"
# `python -m pytest` (not bare `pytest`) so it runs via the env's interpreter.
test = "python -m pytest"
spell = "python -m codespell_lib ."
# Step 0 of the workflow spine: is this project fit to start work in?
# The agent-config command checks the repo it runs in (branch, clean tree, hook
# installation, interpreter). Add --with-tests when starting fresh work,
# --check-updates weekly rather than per session (a network round trip per
# hook repo).
preflight = "preflight"
# Resumable synthetic-program grid runner: `pixi run experiments <grid.yaml>`.
experiments = "python scripts/run_experiments.py"

[tool.pixi.feature.dev.tasks]
# pre-commit is a dev-feature dependency, so the task must run in dev.
precommit = "pre-commit run --all-files"
typecheck = "ty check"
all = { depends-on = ["format", "lint", "ascii", "typecheck", "test"] }
# Step 7 of the workflow spine, and the reflect skill's detection half.
#
# Unlike preflight above, agent-config does not export these two as commands,
# and they are deliberately not copied here. They are cross-project by
# construction: friction mines ~/.claude/projects transcripts
# and reads one shared decision ledger, because transcripts are global so
# suppression has to be global too -- a per-project ledger would re-propose
# classes already decided elsewhere. toolgaps likewise inventories
# agent-config's assets to answer "does a fix already exist?". Copying either
# would fork a global tool and let the copies drift.
#
# The cost is a hard dependency on the sibling checkout living at
# ~/Documents/Projects/agent-config, which is where both scripts resolve it
# from unconditionally. On a machine without that layout these two tasks fail
# and the rest of the project is unaffected.
friction = "python ../Projects/agent-config/scripts/friction.py"
toolgaps = "python ../Projects/agent-config/scripts/toolgaps.py"
# Data-loading throughput measurement (scripts/benchmark_loading.py).
# Deliberately not part of `all`: it needs a CUDA GPU and takes minutes, and
# its answer only changes when the model or the loader path changes.
benchmark-loading = "python scripts/benchmark_loading.py"

[tool.ty.environment]
python-version = "3.14"
# Resolve third-party imports against the dev pixi environment explicitly, so
# `ty` is deterministic whether invoked via `pixi run typecheck` (env activated)
# or directly by the pre-commit hook (`.pixi/envs/dev/bin/ty`, env not active).
python = ".pixi/envs/dev"
# The figure scripts and their tests import _figcommon as a sibling module.
extra-paths = ["report/figures", "packages/redpitaya/src"]

[tool.ty.src]
# notebooks/ are exploratory marimo apps (like .ipynb, already excluded) with
# optional-only deps (e.g. torchview); they are not type-gated library code.
exclude = [".pixi", "**/*.ipynb", "notebooks/**"]

# Rules dominated by PyTorch / scientific-library typing gaps (incomplete third-
# party stubs, autograd Function patterns). Downgraded so the high-signal rules
# stay actionable; promote back to "error" individually as stubs improve.
[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
possibly-missing-submodule = "ignore"

[tool.coverage.run]
source = ["smi"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

# Typst report build (report/). The whole document toolchain is
# lockfile-reproducible with no manual install step -- unlike a LaTeX engine,
# where no conda package ships a usable macro tree.
[tool.pixi.feature.report.dependencies]
# typst only: it is a self-contained Rust binary with no OpenMP/BLAS linkage,
# so it cannot collide with the PyPI numeric stack. matplotlib and h5py come
# from PyPI with everything else -- see the OpenMP note above.
typst = "*"

# Snakemake has no conda-forge win-64 build at all (it is packaged only for
# linux-64/osx), so it comes from PyPI, where the wheels are pure Python and
# run fine here. Verified on win-64: a figure -> typst -> PDF DAG executes and
# re-runs incrementally. Only *local* (--cores) execution is exercised; the
# cluster and --use-conda executors are the parts with real Windows gaps.
[tool.pixi.feature.report.pypi-dependencies]
snakemake = ">=8"
matplotlib = "*"
h5py = "*"

# Report build tasks. These live under the `report` feature, not
# [tool.pixi.tasks], because the latter runs in the default env, which has
# neither typst nor snakemake. `cwd` points them at report/ so the Snakefile's
# relative paths resolve the same whether you invoke a task from the repo root
# or run snakemake by hand from inside report/.
#
# `--scheduler greedy`: the default ILP scheduler shells out to the CBC binary
# bundled with pulp, which is x86-64 only on macOS and fails with "Bad CPU
# type" on osx-arm64 without Rosetta. A handful of figure jobs gains nothing
# from ILP scheduling.
[tool.pixi.feature.report.tasks]
report = { cmd = "snakemake --cores all --scheduler greedy", cwd = "report" }
report-dry = { cmd = "snakemake --cores all --scheduler greedy -n", cwd = "report" }
report-clean = { cmd = "snakemake --cores 1 clean", cwd = "report" }
report-only = { cmd = "snakemake --cores all --scheduler greedy build/report.pdf", cwd = "report" }
report-synthetic = { cmd = "snakemake --cores all --scheduler greedy build/synthetic.pdf", cwd = "report" }

# ty >= 0.0.81 reports invalid-mutable-override on every nn.Module.forward
# override, because torch types `forward` as a mutable Callable attribute.
# Scoped to the model package so the rule still guards everything else; drop
# this override when torch or ty resolves it.
[[tool.ty.overrides]]
include = ["smi/learning/models/**"]
rules = { invalid-mutable-override = "ignore" }

# Package layering; tests/test_import_contracts.py runs this in the suite.
[tool.importlinter]
root_packages = ["smi", "stemlab"]

[[tool.importlinter.contracts]]
name = "stemlab is standalone: it imports nothing from smi"
type = "forbidden"
source_modules = ["stemlab"]
forbidden_modules = ["smi"]

[[tool.importlinter.contracts]]
name = "smi.core is the bottom layer"
type = "forbidden"
source_modules = ["smi.core"]
forbidden_modules = ["smi.theory", "smi.data", "smi.estimators", "smi.learning", "smi.experiments", "smi.acquisition"]

[[tool.importlinter.contracts]]
name = "smi.theory depends only on smi.core"
type = "forbidden"
source_modules = ["smi.theory"]
forbidden_modules = ["smi.data", "smi.estimators", "smi.learning", "smi.experiments", "smi.acquisition"]

[[tool.importlinter.contracts]]
name = "smi.data depends only on smi.core and smi.theory"
type = "forbidden"
source_modules = ["smi.data"]
forbidden_modules = ["smi.estimators", "smi.learning", "smi.experiments", "smi.acquisition"]

[[tool.importlinter.contracts]]
name = "smi.estimators depends only on smi.core and smi.theory"
type = "forbidden"
source_modules = ["smi.estimators"]
forbidden_modules = ["smi.data", "smi.learning", "smi.experiments", "smi.acquisition"]

[[tool.importlinter.contracts]]
name = "smi.learning does not import estimators, experiments or hardware"
type = "forbidden"
source_modules = ["smi.learning"]
forbidden_modules = ["smi.estimators", "smi.experiments", "smi.acquisition"]

[[tool.importlinter.contracts]]
name = "only smi.acquisition imports stemlab"
type = "forbidden"
source_modules = ["smi"]
forbidden_modules = ["stemlab"]
# Everything under smi except smi.acquisition, including any module added
# later: an allow-list of named packages would silently miss one.
ignore_imports = ["smi.acquisition.** -> stemlab", "smi.acquisition.** -> stemlab.**"]

[[tool.importlinter.contracts]]
name = "smi.acquisition and smi.experiments do not import each other"
type = "forbidden"
source_modules = ["smi.acquisition"]
forbidden_modules = ["smi.experiments"]

[[tool.importlinter.contracts]]
name = "smi.experiments does not import smi.acquisition"
type = "forbidden"
source_modules = ["smi.experiments"]
forbidden_modules = ["smi.acquisition"]
